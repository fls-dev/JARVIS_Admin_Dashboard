<body data-page="ops">
<main class="stage">
 <header class="page-h"><h1>Operations <em>queue &amp; workers</em></h1><p><b>2</b> running · <b>3</b> queued · <b>1</b> degraded worker · 24h window</p>
  <div class="tools"><span class="seg g3" id="win"><button data-w="6">1h</button><button class="on" data-w="24">24h</button><button data-w="24">7d</button></span><button class="btn btn-glass btn-sm" id="pause"><span data-ico="pause"></span> Pause queue</button></div></header>
 <div class="opk" id="opk"></div>
 <div class="opg">
  <section class="panel g2 opw"><div class="panel-h"><h3>Throughput</h3><span class="meta" id="tmeta">steps / hour</span></div><div id="chart"></div>
   <div class="ax"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>now</span></div>
   <div class="lg"><span><i style="background:var(--ai)"></i>steps</span><span><i style="background:var(--run)"></i>failures × 10</span></div></section>
  <section class="panel g2"><div class="panel-h"><h3>Workers</h3><span class="meta">4 online</span></div><div class="wk" id="wk"></div></section>
  <section class="panel g2 opq"><div class="panel-h"><h3>Queue</h3><span class="meta">5 steps</span></div><div class="q" id="q"></div></section>
  <section class="panel g2"><div class="panel-h"><h3>Errors · 24h</h3><span class="badge b-bad">2</span></div><div class="rows" id="er"></div></section>
 </div>
</main>
