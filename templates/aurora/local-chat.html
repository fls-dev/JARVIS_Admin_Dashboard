<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='.38' cy='.32' r='.7'><stop offset='0' stop-color='%23fff'/><stop offset='.35' stop-color='%23FF4F93'/><stop offset='1' stop-color='%236D4AFF'/></radialGradient></defs><rect width='64' height='64' rx='16' fill='%2305060C'/><circle cx='32' cy='32' r='19' fill='url(%23g)'/></svg>">
<meta name="author" content="fls-dev — https://github.com/fls-dev">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS Aurora · Local chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages/local-chat.css">
</head>
<body data-page="chat">
<main class="stage">
 <div class="lc">
  <section class="orbcol">
   <header class="page-h"><h1>Local chat <em>on-device</em></h1><div class="tools m-only"><button class="btn btn-glass btn-sm" id="setBtn">Model settings</button></div><p><b>Qwen3 4B Q5_K_M</b> · Jarvis Local · 0 bytes leave the machine · <b>$0.000000</b></p></header>
   <div class="orbbox"><div class="orb" id="orbEl"><canvas id="orb"></canvas></div><svg class="wave" id="wave" viewBox="0 0 560 560" aria-hidden="true"></svg></div>
   <div class="mode"><div class="st" id="st">Generating <em>· 38 tok/s</em></div><div class="sub" id="sub">the core pulses with every token</div></div>
  </section>
  <section class="chat">
   <div class="thread" id="th"></div>
   <div class="composer"><div class="ask g3"><button class="mic" id="mic" aria-label="Push to talk"></button><div class="ask-in"><span class="ph">Speak or type — the core listens…</span></div><div class="meter no-s" id="meter"></div><button class="btn btn-pri send" aria-label="Send"></button></div></div>
  </section>
 </div>
</main>
<aside class="inspector g3" id="ins" data-peek="off"></aside>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/orb.js"></script>
<script src="assets/js/canvas.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/palette.js"></script>
<script src="assets/js/inspector.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/local-chat.js"></script>
</body>
</html>
