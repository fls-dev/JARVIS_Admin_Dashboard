name: ✨ Feature request
description: Suggest a new page, component or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: template
    attributes:
      label: Template
      options:
        - JARVIS Aurora
        - JARVIS Orbital
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it look or behave? Links and sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
