name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the job to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a running production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          mkdir -p _site/docs
          cp index.html _site/
          cp -R templates _site/templates
          cp -R docs/assets _site/docs/assets
          cp docs/social-preview.png _site/docs/
          find _site -name '.DS_Store' -delete
          echo "Site size: $(du -sh _site | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
